name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: core-api, path: services/core-api }
          - { name: ml-worker, path: services/ml-worker }
          - { name: mock-review-board, path: services/mock-review-board }
          - { name: review-scraper, path: jobs/review-scraper }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service.path }}/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[${{ matrix.service.name == 'core-api' && 'dev' || 'dev' }}]"
        working-directory: ${{ matrix.service.path }}

      - name: Ruff lint
        run: ruff check .
        working-directory: ${{ matrix.service.path }}

      - name: Ruff format check
        run: ruff format --check .
        working-directory: ${{ matrix.service.path }}

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: ${{ matrix.service.path }}

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Run tests
        run: npx vitest run
        working-directory: apps/web

      - name: Build
        run: npx vite build
        working-directory: apps/web

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "core-api is ready"
              break
            fi
            echo "Waiting for core-api... ($i/30)"
            sleep 2
          done

      - name: Run smoke tests
        run: bash scripts/ci/smoke.sh

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v
