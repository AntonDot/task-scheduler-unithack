# One-off admin process (12-factor XII): Alembic migrations, S3 bucket, demo seed.
# Same image and config as core-api; runs to completion once per release and exits.
# core-api pods wait for its result in their init container (see 30-core-api.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: task-scheduler
  labels:
    app: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        # The Job has no depends_on: wait until the backing services answer
        - name: wait-for-backing-services
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "waiting for postgres"; sleep 2; done
              until wget -q -O /dev/null http://s3:9000/health; do echo "waiting for s3"; sleep 2; done
      containers:
        - name: migrate
          image: task-scheduler/core-api:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "scripts/migrate.sh"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
