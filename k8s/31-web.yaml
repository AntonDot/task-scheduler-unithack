# web: nginx serves the React SPA and proxies /api and /ws to core-api, so the browser
# talks to one origin. NodePort makes it reachable from outside the cluster:
#   minikube service web -n task-scheduler
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: task-scheduler
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: task-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: task-scheduler/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PORT
              value: "80"
            # nginx resolves the backend per request through its own resolver, which knows
            # nothing about the pod's DNS search list — hence the fully qualified names
            - name: CORE_API_URL
              value: http://core-api.task-scheduler.svc.cluster.local:8000
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
