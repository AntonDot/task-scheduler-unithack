# automation-worker: consumes the RabbitMQ queue and runs automations, calling core-api
# internal endpoints. No Service — the only port is /metrics, scraped from inside the cluster.
# Replicas share the queue as competing consumers, so scaling it is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-worker
  namespace: task-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automation-worker
  template:
    metadata:
      labels:
        app: automation-worker
      annotations:
        # vmagent finds the pod through Kubernetes service discovery by these annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      # On SIGTERM the worker stops consuming and lets in-flight events finish
      terminationGracePeriodSeconds: 30
      # The worker exits if the broker is down at start; wait for it instead of crash-looping
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting for rabbitmq"; sleep 2; done
      containers:
        - name: automation-worker
          image: task-scheduler/automation-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
