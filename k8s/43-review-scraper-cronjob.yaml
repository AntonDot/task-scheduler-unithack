# review-scraper: polls the review board for negative reviews and sends them to ml-worker.
# In compose it is a long-running clock process; here the schedule is Kubernetes' job —
# every minute a pod runs one pass (`--once`) and exits. The scraper keeps no state:
# duplicates are filtered by core-api (external_events), so a missed or repeated run is harmless.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: review-scraper
  namespace: task-scheduler
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app: review-scraper
        spec:
          restartPolicy: Never
          containers:
            - name: review-scraper
              image: task-scheduler/review-scraper:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "scraper.py", "--once"]
              envFrom:
                - configMapRef: { name: app-config }
                - secretRef: { name: app-secrets }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 192Mi }
