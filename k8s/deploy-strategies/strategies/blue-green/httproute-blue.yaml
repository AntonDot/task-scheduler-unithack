# BLUE/GREEN: instant switch of all traffic to blue (v2.0.0). Green keeps running, so the
# rollback is just as instant: apply httproute-green.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: core-api
  namespace: task-scheduler
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /ws }
      backendRefs:
        - name: core-api-v2   # blue, v2.0.0
          port: 8000
