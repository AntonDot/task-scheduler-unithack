# Helm values for grafana-community/grafana (release `grafana`, namespace `monitoring`).
# Grafana keeps no hand-made state: the data source and the dashboards are provisioned from
# this file and from the ConfigMap `grafana-dashboards` (install.sh), so a restarted pod
# comes back the same. No persistent volume: there is nothing to keep.

# Admin password: generated by the chart into the Secret `grafana` (key admin-password).
adminUser: admin

# Grafana's own metrics, found by vmagent like every other pod (k8s/monitoring/vm-agent-values.yaml)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"
# vmagent copies the pod label `app` into the series label `app`
podLabels:
  app: grafana

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }

# VictoriaMetrics speaks the Prometheus query API (PromQL / MetricsQL), so the built-in
# Prometheus data source works without a plugin. The uid is fixed: dashboards refer to it.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s        # vmagent scrape interval: the lower bound for $__rate_interval
          prometheusType: Prometheus
          httpMethod: POST

# Dashboards from the ConfigMap `grafana-dashboards` (install.sh): the app dashboard
# (dashboards/task-scheduler.json) and PostgreSQL Database imported from grafana.com (9628).
# Grafana re-reads the folder every 30 s, so an updated ConfigMap shows up without a restart.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: task-scheduler
        orgId: 1
        folder: Task Scheduler
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/task-scheduler
dashboardsConfigMaps:
  task-scheduler: grafana-dashboards

grafana.ini:
  analytics:
    check_for_updates: false
    check_for_plugin_updates: false
    reporting_enabled: false
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/task-scheduler/task-scheduler.json
  news:
    news_feed_enabled: false
