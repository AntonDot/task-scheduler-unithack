# Bonus: vmalert evaluates a LogsQL query against VictoriaLogs every minute and raises
# an alert when the app writes ERROR lines. No Alertmanager in this demo installation
# (-notifier.blackhole): firing alerts are visible in the vmalert UI and API.
#   kubectl -n logging port-forward svc/vmalert 8880:8880
#   open http://localhost:8880/vmalert/alerts
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: logging
data:
  app-errors.yaml: |
    groups:
      - name: task-scheduler-logs
        type: vlogs
        # The query runs over the last `interval` of logs at every evaluation
        interval: 1m
        rules:
          - alert: AppErrorLogs
            expr: >-
              k8s.namespace:task-scheduler level:ERROR
              | stats by (service.name) count() as errors
              | rename service.name as service
              | filter errors:>0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }}: {{ $value }} ERROR log lines in the last minute"
              logs: "LogsQL: k8s.namespace:task-scheduler level:ERROR service.name:{{ $labels.service }}"
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: logging
  labels:
    app: vmalert
spec:
  selector:
    app: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.153.0
          args:
            - -datasource.url=http://victorialogs.logging.svc.cluster.local:9428
            - -rule=/etc/vmalert/rules/*.yaml
            - -rule.defaultRuleType=vlogs
            - -notifier.blackhole
            - -httpListenAddr=:8880
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
