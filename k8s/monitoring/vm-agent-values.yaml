# Helm values for victoria-metrics-agent (namespace `monitoring`): vmagent discovers pods
# through the Kubernetes API, scrapes the ones annotated with prometheus.io/*, accepts
# pushed metrics from short-lived jobs and remote-writes everything to VictoriaMetrics.
# The name matches the service in the task's commands: vm-single-victoria-metrics-agent:8429.
fullnameOverride: vm-single-victoria-metrics-agent

# Same image as on Docker Hub, pulled from quay.io: Docker Hub's CDN was unreachable here
image:
  registry: quay.io

remoteWrite:
  - url: http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write

# Off by default in the chart. Needed for port-forward and for the push endpoint the
# review-scraper CronJob posts to (/api/v1/import/prometheus on :8429)
service:
  enabled: true

# The chart's ClusterRole lets vmagent list/watch pods for service discovery
rbac:
  create: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

config:
  global:
    scrape_interval: 15s

  scrape_configs:
    - job_name: vmagent
      static_configs:
        - targets: ["localhost:8429"]

    # Service discovery: every pod of the cluster is a candidate target; the relabeling
    # below keeps the annotated ones and builds the address from the annotations.
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        # prometheus.io/scrape: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: "true"
        # Completed CronJob pods and pods being torn down have nothing to serve
        - source_labels: [__meta_kubernetes_pod_phase]
          action: keep
          regex: Running
        # role: pod yields one target per declared container port; keep the one named
        # by prometheus.io/port (VictoriaMetrics' keep_if_equal compares two labels)
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
          action: keep_if_equal
        # prometheus.io/path (default /metrics)
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        # Readable labels on every series: which app, namespace, pod, container, node
        - source_labels: [__meta_kubernetes_pod_label_app]
          target_label: app
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
        - source_labels: [__meta_kubernetes_pod_container_name]
          target_label: container
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
