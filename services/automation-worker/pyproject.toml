[project]
name = "automation-worker"
version = "0.1.0"
description = "Automation Worker — consumes RabbitMQ events and executes automation rules"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    "pywebpush>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
